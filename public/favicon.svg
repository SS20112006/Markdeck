<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="markdeck-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#aa3bff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Slide Background Card -->
  <rect x="6" y="10" width="52" height="40" rx="8" fill="url(#markdeck-grad)" filter="url(#shadow)" />
  <!-- Window bar / slide header line -->
  <rect x="12" y="16" width="16" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.85" />
  <!-- Slide content lines -->
  <rect x="12" y="24" width="40" height="4" rx="2" fill="#ffffff" />
  <rect x="12" y="32" width="28" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.75" />
  <rect x="12" y="38" width="34" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.6" />
  <!-- Presentation base stand -->
  <path d="M26 50 L24 56 L40 56 L38 50 Z" fill="#0071e3" fill-opacity="0.9" />
</svg>
